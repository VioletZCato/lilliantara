<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Lillian Tara — demos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Demo variants for lilliantara.com">
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5ecdd">
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171009">
        <script>try{var t=localStorage.getItem("lt-theme")||"night";if(t!=="auto")document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="night"}</script>
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='30' cy='34' r='13' fill='%23c96b2a'/%3E%3Ccircle cx='47' cy='15' r='5' fill='%23d98e4a'/%3E%3Ccircle cx='13' cy='49' r='4' fill='%23a34d1e'/%3E%3C/svg%3E">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/default.css">
        <style>
            /* chooser-only styles — the site's own stylesheet stays untouched */

            .eyebrow {
                margin: 0;
                font-size: clamp(0.9rem, 2vw, 1.05rem);
                letter-spacing: 0.14em;
                color: var(--ink-soft);
            }

            .choices {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: clamp(0.8rem, 2vw, 1.1rem);
            }

            .choice {
                display: flex;
                flex-direction: column;
                gap: 0.3em;
                min-width: 12.5rem;
                padding: 1.15em 1.4em 1.25em;
                border: 1px solid var(--line);
                border-radius: 14px;
                background: var(--btn-bg);
                box-shadow: var(--btn-shadow);
                backdrop-filter: blur(4px);
                -webkit-backdrop-filter: blur(4px);
                text-decoration: none;
                color: inherit;
                transition:
                    transform 0.35s cubic-bezier(0.2, 0.7, 0.3, 1),
                    background 0.3s ease,
                    border-color 0.3s ease;
            }

            .choice:hover {
                transform: translateY(-3px);
                background: var(--btn-bg-hover);
                border-color: color-mix(in srgb, var(--cinnamon) 45%, transparent);
            }

            .choice:active { transform: translateY(-1px); }

            .choice:focus-visible {
                outline: 2px solid var(--cinnamon);
                outline-offset: 4px;
            }

            .choice-name {
                font-size: clamp(1.35rem, 3vw, 1.7rem);
                line-height: 1.1;
            }

            .choice-note {
                font-size: 0.9rem;
                font-style: italic;
                color: var(--ink-soft);
            }

            /* the segmented controls themselves live in default.css */
            .switches {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: clamp(0.6rem, 1.6vh, 0.9rem);
            }
        </style>
    </head>
    <body>
        <canvas id="spice-back" aria-hidden="true"></canvas>
        <canvas id="spice" aria-hidden="true"></canvas>

        <main>
            <div>
                <p class="eyebrow">LillianTara.com</p>
                <h1>Demos<span class="period">.</span></h1>
            </div>

            <nav class="choices" aria-label="Demo variants">
                <a class="choice" href="buttons.html">
                    <span class="choice-name">Buttons</span>
                    <span class="choice-note">tactile pills</span>
                </a>
                <a class="choice" href="hyperlinks.html">
                    <span class="choice-name">Hyperlinks</span>
                    <span class="choice-note">gapped rule, raised</span>
                </a>
                <a class="choice" href="hyperlinks-solid.html">
                    <span class="choice-name">Hyperlinks</span>
                    <span class="choice-note">solid rule, lowered</span>
                </a>
            </nav>

            <div class="switches">
                <div class="seg" role="group" aria-label="Theme">
                    <button type="button" data-theme-set="auto" aria-pressed="false">Auto</button>
                    <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
                    <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
                    <button type="button" data-theme-set="night" aria-pressed="true">Night</button>
                </div>

                <div class="seg" role="group" aria-label="Tree animation">
                    <button type="button" data-tree-set="legacy-v2" aria-pressed="false">Legacy (v2)</button>
                    <button type="button" data-tree-set="phylo-v4" aria-pressed="true">Phylo (v4)</button>
                    <button type="button" data-tree-set="lively-v5" aria-pressed="false">Lively (v5)</button>
                    <button type="button" data-tree-set="hybrid-v6" aria-pressed="false">Hybrid (v6)</button>
                </div>
            </div>
        </main>

        <script src="js/spice.js?v=6" defer></script>
        <script src="js/controls.js?v=6" defer></script>
        <script src="js/torch.js?v=6" defer></script>
    </body>
</html>
